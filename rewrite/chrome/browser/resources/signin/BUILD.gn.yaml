substitutions:
  - description: Import the custom profile image availability flag.
    add_import:
      import: //brave/ui/webui/custom_profile_image/buildflags/buildflags.gni
  - description:
      Preprocess custom image code with its resource availability flag.
    append_to_target:
      target: build
      type: build_webui
      code: |-
        preprocessor_defines = [ "enable_brave_custom_profile_image_webui=$enable_brave_custom_profile_image_webui" ]

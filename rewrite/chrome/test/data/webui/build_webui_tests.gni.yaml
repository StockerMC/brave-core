substitutions:
  - description: Forward optional feature defines to preprocess_static_files.
    append_to_target:
      target: preprocess_static_files
      type: preprocess_if_expr
      code: |-
        if (defined(invoker.preprocessor_defines)) {
          defines += invoker.preprocessor_defines
        }
  - description: Forward optional feature defines to preprocess.
    append_to_target:
      target: preprocess
      type: preprocess_if_expr
      code: |-
        if (defined(invoker.preprocessor_defines)) {
          defines += invoker.preprocessor_defines
        }
